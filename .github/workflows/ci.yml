name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # agent-realtime's tests run the real server, twice, on one Redis: UI action
    # results and room fan-out cross instances only through it. The tests use
    # REDIS_URL, or start a local redis-server when it is unset; neither is a
    # skip.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      - name: Test
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm test:ci

      # Every published package's tarball: name, MIT, LICENSE and README,
      # repository and directory (what provenance is checked against), public
      # access with provenance, every entry point present, still 0.x.
      - name: Package contents
        run: pnpm packs:check

      # The packages as a product outside this repository gets them: packed,
      # installed with npm into an empty directory, and used — every entry
      # point, the contract, the generator's command, and a whole agent turn on
      # the fixture product (scripts/consumer-smoke).
      - name: Consumer smoke test (from the packed tarballs)
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm smoke --dir "$RUNNER_TEMP/consumer-smoke"

      # A release is decided in its pull request: changesets are applied there,
      # and a package whose shipped source changed has a new version.
      - name: Release check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            pnpm release:check --base "origin/${{ github.base_ref }}"
          else
            pnpm release:check
          fi

      - name: Documentation site
        run: pnpm site

  # oui-spec runs in browsers and in any Node a product's server uses, so its
  # own suite also runs on the oldest Node it supports.
  oui-spec-node:
    name: oui-spec on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter oui-spec...
      - run: pnpm --filter oui-spec typecheck
      - run: pnpm --filter oui-spec test
      - run: pnpm --filter oui-spec build

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
