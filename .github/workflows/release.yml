name: Release

# A `v*` tag on a commit of `main` publishes, to npm with provenance, every
# package whose version in that commit is not on npm yet. Versions and
# changelogs were decided in the pull requests that led to it (RELEASING.md),
# so the tag only says when.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit of main: releases are tagged on main only"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The realtime server's tests, the worker's and the consumer smoke test
      # each run real servers on Redis. Every test file starts its own
      # redis-server (no shared Redis URL): servers that share a Redis are one
      # cluster, so on a shared one a file's emit reached other files' sockets
      # and its receipt counts came out wrong.
      - name: Install redis-server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && redis-server --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Test
        run: pnpm test:ci
      - run: pnpm packs:check
      - name: Consumer smoke test (from the packed tarballs)
        run: pnpm smoke --dir "$RUNNER_TEMP/consumer-smoke"
      - run: pnpm release:check

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: The publishing account
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OUISPEC_SCOPE_TOKEN }}
        run: npm whoami

      - name: Publish
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OUISPEC_SCOPE_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set +e
          pnpm changeset publish 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          grep -oE 'New tag:\s+\S+' publish.log | awk '{print $3}' > new-tags.txt
          echo "published $(wc -l < new-tags.txt | tr -d ' ') package(s)"
          exit $status

      # Each published version gets its tag (`<name>@<version>`) and a GitHub
      # release carrying its CHANGELOG entry, also when another package in the
      # same run failed to publish.
      - name: Tags and GitHub releases
        if: always() && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s new-tags.txt ] || { echo "nothing was published"; exit 0; }
          while read -r tag; do
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            name="${tag%@*}"; version="${tag##*@}"
            dir=$(node --input-type=module -e "const {publishedPackages}=await import('./scripts/workspace.mjs');process.stdout.write(publishedPackages().find(p=>p.pkg.name===process.argv[1]).dir)" "$name")
            awk -v v="$version" '$0 ~ "^## "v"$" {on=1; next} /^## / && on {exit} on' "$dir/CHANGELOG.md" > notes.md
            printf '\n---\n\n`npm install %s@%s`\n' "$name" "$version" >> notes.md
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag \
              $( [[ "$version" == *-* ]] && echo --prerelease )
          done < new-tags.txt

  # What was just published, as anyone gets it: this job has no secrets and no
  # registry but the public one. It installs the tagged versions from
  # registry.npmjs.org into an empty directory and runs the consumer smoke
  # test there.
  prove:
    name: Install from public npm and run
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install redis-server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && redis-server --version
      - name: Install from registry.npmjs.org and run
        run: |
          # A new package is served some minutes after it is published: the
          # first @ouispec release answered 404 for five. Try for twenty.
          for attempt in $(seq 1 30); do
            rm -rf "$RUNNER_TEMP/public-install"
            if node scripts/consumer-smoke/run.mjs --dir "$RUNNER_TEMP/public-install" --from registry; then exit 0; fi
            echo "attempt $attempt failed; waiting before trying again"
            sleep 40
          done
          exit 1
